<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Types</title>
</head>

<body>
  <h1>Form Attributes</h1>
  <form action="submit.php" method="post" target="_blank">
    <!-- Input type = Text -->
    <label for="username">Username:</label>
    <input type="text" name="username" id="username"><br><br>

    <!-- Type: Password -->
    <label for="password">Password</label>
    <input type="password" id="password" name="password"> <br><br>

    <!-- Type: Radio -->
    <label for="">Gender :</label>
    <input type="radio" name="gender" value="male" id="male">
    <label for="male">Male</label>

    <input type="radio" name="gender" value="female" id="female">
    <label for="female">Female</label>

    <input type="radio" name="gender" value="other" id="other">
    <label for="other">Other</label>
    <br><br>

    <!-- Type: Checkbox -->
     <label for="">Hobbies :</label>
     <input type="checkbox" name="hobbies" value="reading" id="reading">
     <label for="reading">Reading</label>

     <input type="checkbox" name="hobbies" value="sport" id="sport">
     <label for="sport">Sport</label>

     <input type="checkbox" name="hobbies" value="music" id="music">
     <label for="music">Music</label> <br><br>

    <input type="submit" value="Submit">
    <input type="reset" value="Reset">
  </form>
</body>

</html>
