<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Types</title>
</head>

<body>
  <h1>Form Attributes</h1>
  <form action="submit.php" method="post" target="_blank" enctype="multipart/form-data">
    <!-- Input type = Text -->
    <label for="username">Username:</label>
    <input type="text" name="username" id="username"><br><br>

    <!-- Type: Password -->
    <label for="password">Password</label>
    <input type="password" id="password" name="password"> <br><br>

    <!-- Type: Radio -->
    <label for="">Gender :</label>
    <input type="radio" name="gender" value="male" id="male">
    <label for="male">Male</label>

    <input type="radio" name="gender" value="female" id="female">
    <label for="female">Female</label>

    <input type="radio" name="gender" value="other" id="other">
    <label for="other">Other</label>
    <br><br>

    <!-- Type: Checkbox -->
    <label for="">Hobbies :</label>
    <input type="checkbox" name="hobbies" value="reading" id="reading">
    <label for="reading">Reading</label>

    <input type="checkbox" name="hobbies" value="sport" id="sport">
    <label for="sport">Sport</label>

    <input type="checkbox" name="hobbies" value="music" id="music">
    <label for="music">Music</label> <br><br>

    <!-- Type: File -->
    <label for="file-single">Upload Single File:</label>
    <input type="file" name="file-single" id="file-single"><br><br>

    <!-- Type: Multiple File -->
    <label for="file-multiple">Upload Multiple Files</label>
    <input type="file" name="file-multiple" id="file-multiple" multiple> <br><br>

    <!-- Type: Color -->
    <label for="favcolor">Select a Color</label>
    <input type="color" name="favcolor" id="favcolor"> <br><br>

    <!-- Type: Date -->
    <label for="birthday">Birth Day:</label>
    <input type="date" id="birthday" name="birthday"><br><br>

    <!-- Type: Datetime-Local -->
    <label for="meeting">Meeting:</label>
    <input type="datetime-local" id="meeting" name="meeting"><br><br>

    <!-- Type: Time -->
    <label for="alarm">Alarm:</label>
    <input type="time" id="alarm" name="alarm"><br><br>

    <!-- Type: Month -->
    <label for="expiry">Expiry Month:</label>
    <input type="month" id="expiry" name="expiry"> <br><br>

    <!-- Type: Week -->
    <label for="week">Week:</label>
    <input type="week" id="week" name="week"> <br><br>

    <!-- Type: Email -->
    <label for="useremail">User Email:</label>
    <input type="email" id="useremail" name="useremail"><br><br>

    <!-- Type: Number -->
    <label for="quantity">Quantity:</label>
    <input type="number" id="quantity" name="quantity"><br><br>

    <!-- Type: Range -->
    <label for="volume">Volume:</label>
    <input type="range" id="volume" name="volume"><br><br>

    <!-- Type: Search -->
    <label for="query">Search Box</label>
    <input type="search" id="query" name="query"><br><br>

    <!-- Type: Phone -->
    <label for="phone">Phone</label>
    <input type="tel" id="phone" name="phone"><br><br>

    <!-- Type: URL -->
    <label for="website">Website URL</label>
    <input type="url" id="website" name="website"><br><br>

    <input type="submit" value="Submit">
    <input type="reset" value="Reset">
  </form>
</body>

</html>
