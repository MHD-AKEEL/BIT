<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block VS Inline</title>
</head>
<body>
    <h3>Block VS Inline Elements</h3>

    <!-- Block Elements -->
     <h5>Block Elements</h5>
    <p style="border:solid 1px red">This is first inside the body tag.</p>
    <p style="border: solid 1px green;">This is second inside the body tag.</p>

    <!-- Inline Elements -->
     <h5>Inline Elements</h5>
     <span style="border: solid 1px yellowgreen;">This is first span inside the body tag.</span>
</body>
</html>
