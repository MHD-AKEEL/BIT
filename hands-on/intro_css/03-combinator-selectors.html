<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combinator Selectors</title>
    <style>
        .container-1, .container-2{
            border: 2px solid black;
            margin-bottom: 15px;
        }
        /* Descendant selector */
        .container-1, .container-2 p{
            color: blue;
        }
        /* Child selector */
        .container-1 > p, .container-2 > p{
            border:2px solid green;
        }
    </style>
</head>
<body>
    <div class="container-1">
        <p>paragraph 01 (Direct Child)</p>

        <selection>
            <p>paragraph 02 (Grand Child)</p>

            <article>
                <p>paragraph 03 (Grand Grand Child)</p>
            </article>
        </selection>
    </div>

    <div class="container-2">
        <p>paragraph 01 (Direct Child)</p>

        <selection>
            <p>paragraph 02 (Grand Child)</p>

            <article>
                <p>paragraph 03 (Grand Grand Child)</p>
            </article>
        </selection>
    </div>
</body>
</html>
