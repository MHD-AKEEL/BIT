<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combinator Selectors</title>
</head>
<body>
    <div class="container">
        <p>paragraph 01 (Direct Child)</p>

        <selection>
            <p>paragraph 02 (Grand Child)</p>

            <article>
                <p>paragraph 03 (Grand Grand Child)</p>
            </article>
        </selection>
    </div>
</body>
</html>
