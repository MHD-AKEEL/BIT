<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders</title>
    <style>
        .container {
            border: solid 1px black;
            padding: 15px;
            text-align: center;
            margin: 5px;
        }
    </style>
</head>

<body>
    <H2>Border Styles</H2>
    <div style="border: solid 1px black;" class="container">Solid border</div>
    <div style="border: dashed 1px black;" class="container">Dashed border</div>

    <h2>Border width</h2>
    <div class="container" style="border-width: medium;">Border width medium</div>
    <div class="container" style="border-width: thick;">Border width thick</div>
    

</body>

</html>
