<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margin and Padding</title>
    <style>
          .container {
            border: solid 1px black;
            padding: 15px;
            text-align: center;
            background-color: aqua;
        }
        .box{
            width: 250px;
            border: solid 1px black;
            background-color: aqua;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <h2>Padding</h2>
    <div class="container" style="padding-top: 25px;">Padding top 25px</div>
    <div class="container" style="padding-bottom: 25px;">Padding bottom 25px</div>
    <div class="container" style="padding-left: 25px;">Padding left 25px</div>
    <div class="container" style="padding-right: 25px;">Padding right 25px</div>

    <h2>Margin</h2>
    <div class="container" style="margin-top: 25px;">Margin top 25px</div>
    <div class="container" style="margin-bottom: 25px;">Margin bottom 25px</div>
    <div class="container" style="margin-left: 25px;">Margin left 25px</div>
    <div class="container" style="margin-right: 25px;">Margin right 25px</div>

    <h2>Center a boc horizontally</h2>
    <div class="box">horizontally center</div>

</body>
</html>
