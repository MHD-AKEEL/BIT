<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margin and Padding</title>
    <style>
          .container {
            border: solid 1px black;
            padding: 15px;
            text-align: center;
            background-color: aqua;
        }
    </style>
</head>
<body>
    <h2>Padding</h2>
    <div class="container" style="padding-top: 25px;">Padding top 25px</div>
    <div class="container" style="padding-bottom: 25px;">Padding bottom 25px</div>
    <div class="container" style="padding-left: 25px;">Padding left 25px</div>
    <div class="container" style="padding-right: 25px;">Padding right
</body>
</html>
