<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background</title>
    <style>
        .container{
            width: 400px;
            border: 1px solid black;
            padding: 15px;
            margin-bottom: 10px;
        }
        .bg-green{
            background-color: rgb(0, 255, 0);
        }
        /* Background image styles */
        .body{
            background-image: url('./images.jp');
        }

    </style>
</head>
<body class="body">
    <h2>Background color</h2>
    <div class="container bg-green">RGB</div>

    <h2>Background image</h2>
    <div class="bg-image">RGB</div>
</body>
</html>
