<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display</title>
    <style>
        .box{
            border: 1px solid black;
            padding: 20px;
            width: 400px;
            margin-bottom: 10px;
        }
        .red{
            background-color:red;
        }
        .green{
            background-color:green;
        }
        /* display inline */
        .inline{
            display:inline;
        }
    </style>
</head>
<body>
    <h2>Display properties</h2>

    <h3>Display default/ block</h3>
    <div class="box red">First Box</div>
    <div class="box green">Second Box</div>

    <h3>Display Inline</h3>
    <div class="box red inline">First Box</div>
    <div class="box green inline">Second Box</div>
</body>
</html>
